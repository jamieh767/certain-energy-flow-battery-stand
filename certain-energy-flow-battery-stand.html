GP+l7Q0twS4yR9TS+Uph5b9t/ilWgUA) format(\"woff2\")}<\/style><\/head><body><style>\n/* Layout: black brand hero, controls, a wide site illustration (renewables, bulk tank, 20 ft container, H2 skid and buffer tank, data centre),\n   then a zoom into one cell, key and reaction cards. Day scene while charging, night scene while discharging.\n   Palette and type from certainenergy.com: off-black #141414, green #3cbeb3, purple #5e2e8b, Overpass and Overpass Mono. */\n:root {\n  --bg: #f9f9f9;\n  --panel: #ffffff;\n  --fg: #141414;\n  --muted: #5b5f61;\n  --line: #e1e1e1;\n  --stroke: #141414;\n  --pipe: #c4c8c8;\n  --mem: #d2d2d2;\n  --btn-bg: #1a1b1f;\n  --btn-fg: #ffffff;\n  --hero-bg: #000000;\n  --hero-fg: #ffffff;\n  --hero-muted: #c4c8c8;\n  --green: #3cbeb3;\n  --purple: #5e2e8b;\n  --on-green: #141414;\n  --mn2: #eab0c2;\n  --mn3: #5e2e8b;\n  --h2: #3cbeb3;\n  --proton: #f0a030;\n  --elec: #2f7de1;\n  --power: #ffc928;\n  --font-body: \"Overpass\", Helvetica, Calibri, Arial, sans-serif;\n  --font-mono: \"Overpass Mono\", ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n}\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) {\n    --bg: #141414; --panel: #1e1e1e; --fg: #f9f9f9; --muted: #a9adae; --line: #383838;\n    --stroke: #e1e1e1; --pipe: #3d4040; --mem: #5a5d5d; --btn-bg: #2a2b2f; --btn-fg: #ffffff;\n    color-scheme: dark;\n  }\n}\n:root[data-theme=\"dark\"] {\n  --bg: #141414; --panel: #1e1e1e; --fg: #f9f9f9; --muted: #a9adae; --line: #383838;\n  --stroke: #e1e1e1; --pipe: #3d4040; --mem: #5a5d5d; --btn-bg: #2a2b2f; --btn-fg: #ffffff;\n  color-scheme: dark;\n}\nbody { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }\n.hero { background: var(--hero-bg); color: var(--hero-fg); }\n.hero-in { max-width: 1100px; margin-inline: auto; padding-inline: 16px; padding-block: 28px 36px; display: flex; flex-direction: column; gap: 22px; }\n.logo { display: block; width: min(250px, 70%); height: auto; }\n.eyebrow { font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--green); margin: 0 0 10px; }\nh1 { font-size: clamp(26px, 5vw, 40px); line-height: 1.08; font-weight: 900; text-transform: uppercase; margin: 0 0 12px; text-wrap: balance; }\n.lede { margin: 0; color: var(--hero-muted); max-width: 64ch; }\n.wrap { max-width: 1100px; margin-inline: auto; padding-inline: 16px; padding-block: 24px 36px; display: flex; flex-direction: column; gap: 20px; }\n.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 24px; }\n.seg { display: inline-flex; border: 1px solid var(--line); background: var(--panel); }\n.seg button { font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; padding: 12px 20px; border: 0; background: transparent; color: var(--fg); cursor: pointer; }\n.seg button + button { border-left: 1px solid var(--line); }\n.seg button[aria-pressed=\"true\"] { background: var(--green); color: var(--on-green); }\n.seg button:focus-visible, .play:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }\n.play { font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; padding: 12px 18px; border: 1px solid var(--line); background: var(--btn-bg); color: var(--btn-fg); cursor: pointer; min-width: 100px; }\n.soc { display: flex; align-items: center; gap: 12px; flex: 1 1 260px; min-width: 0; }\n.soc-label { font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); white-space: nowrap; }\n.bar { flex: 1 1 80px; height: 8px; background: var(--line); overflow: hidden; min-width: 60px; }\n.bar > span { display: block; height: 100%; width: 70%; background: var(--green); }\n.soc-val { font-family: var(--font-mono); font-weight: 600; font-variant-numeric: tabular-nums; min-width: 4ch; text-align: right; }\n.status { font-size: 14px; color: var(--muted); min-height: 1.4em; margin: 0; }\nfigure { margin: 0; border: 1px solid var(--line); background: var(--panel); overflow-x: auto; }\nfigure svg.fig { display: block; width: 100%; height: auto; color: var(--stroke); }\n#scene { min-width: 940px; }\n#inset { min-width: 560px; max-width: 800px; margin-inline: auto; }\nfigcaption { padding: 10px 16px 14px; font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); }\nsvg text { font-family: var(--font-body); fill: var(--fg); }\nsvg .sub { fill: var(--muted); }\nsvg .lab { font-weight: 600; }\n#scene .nightsky, #scene .sun, #scene .moon, #scene .stars, #scene .win, #scene .w-in, #scene .w-out { transition: opacity 1.2s, fill 1s; }\n#scene .nightsky { opacity: 0; }\n#scene.night .nightsky { opacity: 1; }\n#scene .moon, #scene .stars { opacity: 0; }\n#scene.night .moon, #scene.night .stars { opacity: 1; }\n#scene.night .sun { opacity: 0; }\n#scene .win { fill: #8fa7b3; }\n#scene.night .win { fill: #ffd66b; }\n#scene.night .w-in { opacity: 0.25; }\n#scene .w-out { opacity: 0.25; }\n#scene.night .w-out { opacity: 1; }\n@media (prefers-reduced-motion: reduce) {\n  #scene .nightsky, #scene .sun, #scene .moon, #scene .stars, #scene .win, #scene .w-in, #scene .w-out { transition: none; }\n}\n.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 0; padding: 0; list-style: none; font-size: 15px; }\n.legend li { display: flex; align-items: center; gap: 8px; }\n.dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--stroke); flex: none; }\n.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }\n.card { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--green); padding: 14px 16px 16px; min-width: 0; }\n.card.pos { border-top-color: var(--purple); }\n.card h2 { font-family: var(--font-mono); font-size: 11px; letter-spacing: 2px; y=\"551\" font-size=\"14\">cell stacks<\/text>\n        <text class=\"lab\" x=\"868\" y=\"531\">H\u2082 compressor<\/text><text class=\"sub\" x=\"868\" y=\"551\" font-size=\"14\">and regulator<\/text>\n        <text class=\"lab\" x=\"1008\" y=\"531\">Electrolyser<\/text><text class=\"lab\" x=\"1008\" y=\"551\">buffer tank<\/text><text class=\"sub\" x=\"1008\" y=\"570\" font-size=\"14\">H\u2082 up to 30 bar<\/text>\n        <text class=\"lab\" x=\"1195\" y=\"531\">Data centre<\/text><text class=\"sub\" x=\"1195\" y=\"551\" font-size=\"14\">power on discharge<\/text>\n      <\/g>\n    <\/svg>\n  <\/figure>\n\n  <figure class=\"v-inset\">\n    <svg id=\"inset\" class=\"fig\" viewBox=\"0 0 760 306\" role=\"img\" aria-label=\"Zoom into one cell of a stack. Electrolyte enters from the left, flows up through the liquid electrode and leaves to the left. The liquid electrode and the hydrogen electrode are both felt, pressed against the membrane. Protons cross the membrane. Electrons travel through an external circuit above the cell. Hydrogen is made in, or fed to, the hydrogen electrode through a central port.\">\n      <defs>\n        <pattern id=\"felt\" width=\"5\" height=\"5\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\">\n          <rect width=\"5\" height=\"5\" fill=\"var(--panel)\"/>\n          <line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"5\" stroke=\"currentColor\" stroke-width=\"2\" opacity=\"0.55\"/>\n        <\/pattern>\n        <pattern id=\"feltG\" width=\"5\" height=\"5\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(-45)\">\n          <rect width=\"5\" height=\"5\" fill=\"var(--panel)\"/>\n          <line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"5\" stroke=\"var(--green)\" stroke-width=\"2\" opacity=\"0.9\"/>\n        <\/pattern>\n      <\/defs>\n      <rect x=\"250\" y=\"80\" width=\"260\" height=\"190\" fill=\"var(--panel)\" stroke=\"currentColor\" stroke-width=\"2.5\"/>\n      <!-- Mn side: felt electrode fills the channel against the membran eps delivering for many hours, days or even weeks, not just the one to four hours typical of lithium-ion batteries.<\/p><\/section>\n    <section class=\"card\"><h2>Why it is needed<\/h2><p class=\"note\">As wind and solar supply more of the grid, the weather decides when power is made. Long-duration storage moves it from windy, sunny periods to calm, dark ones, including gaps that last for days.<\/p><\/section>\n    <section class=\"card wide\"><h2>Why our technology<\/h2><p class=\"note\">Power and energy are sized separately, so more hours means more storage volume, not a bigger battery. It uses abundant manganese and hydrogen, with a non-flammable, non-volatile, non-toxic electrolyte.<\/p><\/section>\n  <\/div>\n  <div class=\"cards v-inset\">\n    <section class=\"card pos\" aria-live=\"polite\">\n      <h2>Positive electrode (Mn side)<\/h2>\n      <p class=\"eq\" id=\"eq-pos\"><\/p>\n      <p class=\"note\" id=\"note-pos\"><\/p>\n    <\/section>\n    <section class=\"card\" aria-live=\"polite\">\n      <h2>Negative electrode (H\u2082 side)<\/h2>\n      <p class=\"eq\" id=\"eq-neg\"><\/p>\n      <p class=\"note\" id=\"note-neg\"><\/p>\n    <\/section>\n    <section class=\"card wide\" aria-live=\"polite\">\n      <h2>Overall<\/h2>\n      <p class=\"eq\" id=\"eq-all\"><\/p>\n    <\/section>\n  <\/div>\n<\/div>\n\n<script>\n(function () {\n  var $ = function (id) { return document.getElementById(id); };\n  var NS = 'http://www.w3.org/2000/svg';\n  var MN2 = [234, 176, 194], MN3 = [94, 46, 139];\n  var mix = function (a, b, t) {\n    return 'rgb(' + [0, 1, 2].map(function (i) { return Math.round(a[i] + (b[i] - a[i]) * t); }).join(',') + ')';\n  };\n  var clamp = function (v, lo, hi) { return Math.max(lo, Math.min(hi, v)); };\n  var scene = $('scene');\n\n  /* ---------- geometry helpers: every flow is a polyline route ---------- */\n  function route(pts) {\n    var cum = [0], k;\n    for (k = 1; k < pts.length; k++) cum.push(cum[k - 1] + Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]));\n    return { pts: pts, cum: cum, len: cum[cum.length - 1] };\n  }\n  function quad(p0, c, p1, n) {\n    var pts = [], k, t;\n    for (k = 0; k <= n; k++) {\n      t = k / n;\n      pts.push([(1 - t) * (1 - t) * p0[0] + 2 * (1 - t) * t * c[0] + t * t * p1[0], (1 - t) * (1 - t) * p0[1] + 2 * (1 - t) * t * c[1] + t * t * p1[1]]);\n    }\n    return pts;\n  }\n  function rev(r) { return route(r.pts.slice().reverse()); }\n  function routeAt(r, d) {\n    var k = 1;\n    while (k < r.cum.length - 1 && r.cum[k] < d) k++;\n    var seg = (r.cum[k] - r.cum[k - 1]) || 1, t = clamp((d - r.cum[k - 1]) / seg, 0, 1);\n    return [r.pts[k - 1][0] + (r.pts[k][0] - r.pts[k - 1][0]) * t, r.pts[k - 1][1] + (r.pts[k][1] - r.pts[k - 1][1]) * t];\n  }\n  function dOf(r) { return 'M' + r.pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' L'); }\n  function el(name, attrs, parent) {\n    var e = document.createElementNS(NS, name);\n    for (var k in attrs) e.setAttribute(k, attrs[k]);\n    if (parent) parent.appendChild(e);\n    return e;\n  }\n  function pipe(r, parent, wall, bore, wallCol, boreCol) {\n    var d = dOf(r);\n    el('path', { d: d, fill: 'none', stroke: wallCol, 'stroke-width': wall, 'stroke-linejoin': 'round' }, parent);\n    el('path', { d: d, fill: 'none', stroke: boreCol, 'stroke-width': bore, 'stroke-linejoin': 'round' }, parent);\n  }\n  function wire(r, parent) {\n    var d = dOf(r);\n    el('path', { d: d, fill: 'none', stroke: '#ffffff', 'stroke-width': 3.6, opacity: 0.55 }, parent);\n    el('path', { d: d, fill: 'none', stroke: '#46504e', 'stroke-width': 1.6 }, parent);\n  }\n\n  /* ---------- state ---------- */\n  var charging = false, playing = true, soc = 70, ang = 0, cang = 0, bang = 0;\n  var reduce = false;\n  if (reduce) playing = false;\n\n  /* ---------- flows ---------- */\n  var FLOWS = [];\n  function addFlow(o) {\n    var f = { get: o.get, speed: o.speed, fill: o.fill, fade: o.fade, 'line', { x1: cx - 30, y1: 364, x2: cx + 30, y2: 364, stroke: '#b9c4c1', 'stroke-width': 2 }, stacks);\n    el('line', { x1: cx - 30, y1: 440, x2: cx + 30, y2: 440, stroke: '#b9c4c1', 'stroke-width': 2 }, stacks);\n  });\n\n  // hydrogen line (dead-ended: gas appears at the electrode and only travels stack -> tank)\n  var gp = $('gaspipes');\n  var header = route([[STACK_X[0] + 12, 334], [806, 334], [822, 334], [822, 430], [835, 430]]);\n  var brUp = route([[835, 430], [835, 405], [900, 405], [900, 430]]);\n  var brLo = route([[835, 430], [835, 455], [900, 455], [900, 430]]);\n  var tankIn = route([[900, 430], [935, 430]]);\n  [header, brUp, brLo, tankIn].forEach(function (r) { pipe(r, gp, 9, 5, WALL, BORE); });\n  STACK_X.forEach(function (cx, i) {\n    pipe(route([[cx + 12, 358], [cx + 12, 334]]), gp, 9, 5, WALL, BORE);\n    var y = 372 + i * 20;\n    var ch = route([[cx + 14, y], [cx + 12, 358], [cx + 12, 334], [806, 334], [822, 334], [822, 430], [835, 430], [835, 405], [900, 405], [900, 430], [935, 430], [956, 430]]);\n    var di = route([[956, 430], [935, 430], [900, 430], [900, 455], [835, 455], [835, 430], [822, 430], [822, 334], [806, 334], [cx + 12, 334], [cx + 12, 358], [cx + 14, y]]);\n    addFlow({ parent: pGas, n: 3, r: 2.7, speed: 75, stroke: DK, color: '#3cbeb3', fade: true, get: function () { return charging ? ch : di; } });\n  });\n\n  // power: buried cables enter and leave from underneath\n  var CY = 500;\n  var pvF = route([[81, 470], [81, CY], [193, CY]]);\n  var wtF = route([[193, 470], [193, CY]]);\n  var trunkIn = route([[193, CY], [470, CY], [470, 472]]);\n  var trunkOut = route([[780, 472], [780, CY], [1256, CY], [1256, 472]]);\n  var branches = [1136, 1196].map(function (x) { return route([[x, CY], [x, 472]]); });\n  function duct(r, parent) {\n    var d = dOf(r);\n    el('path', { d: d, fill: 'none', stroke: 'currentColor', 'stroke-width': 7, opacity: 0.12, 'stroke-linejoin': 'round' }, parent);\n    el('path', { d: d, fill: 'none', stroke: 'currentColor', 'stroke-width': 1.6, 'stroke-dasharray': '7 5', opacity: 0.75, 'stroke-linejoin': 'round' }, parent);\n  }\n  [pvF, wtF, trunkIn].forEach(function (r) { duct(r, $('wires-in')); });\n  [trunkOut].concat(branches).forEach(function (r) { duct(r, $('wires-out')); });\n  var PW = '#ffc928';\n  [[pvF, 3, 45], [wtF, 2, 20], [trunkIn, 9, 70]].forEach(function (a) {\n    addFlow({ parent: pPow, n: a[1], r: 3.2, speed: a[2], stroke: '#7a5b00', color: PW, get: function () { return charging ? a[0] : null; } });\n  });\n  [[trunkOut, 12, 80]].concat(branches.map(function (h) { return [h, 2, 20]; })).forEach(function (a) {\n    addFlow({ parent: pPow, n: a[1], r: 3.2, speed: a[2], stroke: '#7a5b00', color: PW, get: function () { return charging ? null : a[0]; } });\n  });\n\n  /* ---- zoom into one cell (same motion as the V1 stack: steady, evenly spaced, no per-lane choreography) ---- */\n  var pc = $('parts-cell');\n  var mnCell = route([[200, 250], [323, 250], [323, 100], [200, 100]]); // in from the left, up through the liquid electrode, out to the left\n  var mnPh = []; for (i = 0; i < 14; i++) mnPh.push(i / 14);\n  addFlow({ parent: pc, n: 14, r: 4.4, speed: 60, stroke: 'currentColor', fade: 0.04, phases: mnPh, get: function () { return mnCell; },\n    fill: function (u) { var ch = clamp((u - 0.18) / 0.64, 0, 1); return mix(reactant(), product(), ch); } });\n  // Protons come from the acid, so they start a little short of the Mn ions (x = 323) and cross the membrane towards the hydrogen electrode on charge, back on discharge.\n  [126, 164, 202, 240].forEach(function (y, k) {\n    var pr = route([[345, y], [437, y]]), prR = rev(pr);\n    addFlow({ parent: pc, n: 2, r: 4.2, speed: 46, stroke: 'currentColor', color: '#f0a030', phases: [k * 0.13, k * 0.13 + 0.5], get: function () { return charging ? pr : prR; } });\n  });\n  // Hydrogen is made (or used) in the felt and collects at a central port in the plate. It never goes past the plate.\n  [104, 140, 176, 212, 248].forEach(function (y, k) {\n    var gc = route([[440, y], [484, 175]]), gd = rev(gc);\n    addFlow({ parent: pc, n: 2, r: 3.6, speed: 40, stroke: 'currentColor', color: '#3cbeb3', fade: 0.12, phases: [k / 10, (k + 5) / 10], get: function () { return charging ? gc : gd; } });\n  });\n  // ...and the same hydrogen carries on through the port pipe: out to the compressor on charge, in from the tank on discharge.\n  var gp1 = route([[488, 175], [596, 175]]), gp1R = rev(gp1);\n  addFlow({ parent: pc, n: 4, r: 3.6, speed: 40, stroke: 'currentColor', color: '#3cbeb3', fade: 0.06, phases: [0, 0.25, 0.5, 0.75], get: function () { return charging ? gp1 : gp1R; } });\n  var elec = route([[498, 84], [498, 30], [262, 30], [262, 84]]), elecR = rev(elec);\n  addFlow({ parent: pc, n: 10, r: 3.8, speed: 90, stroke: 'currentColor', color: '#2f7de1', phases: Array.apply(null, Array(10)).map(function (_, j) { return j / 10; }), get: function () { return charging ? elecR : elec; } });\n\n  /* ---------- text ---------- */\n  var TXT = {\n    discharge: {\n      pos: '2Mn<sup>3+<\/sup> + 2e<sup>\u2212<\/sup> \u2192 2Mn<sup>2+<\/sup>',\n      posNote: 'Violet Mn\u00b3\u207a in the electrolyte takes up electrons and turns into pale Mn\u00b2\u207a.',\n      neg: 'H<sub>2<\/sub> \u2192 2H<sup>+<\/sup> + 2e<sup>\u2212<\/sup>',\n      negNote: 'Stored hydrogen, let down through the regulator, gives up electrons. They flow to the data centre. The protons cross the membrane.',\n      all: 'H<sub>2<\/sub> + 2Mn<sup>3+<\/sup> \u2192 2H<sup>+<\/sup> + 2Mn<sup>2+<\/sup>',\n      load: 'Load', gas: 'H\u2082 from tank'\n    },\n    charge: {\n      pos: '2Mn<sup>2+<\/sup> \u2192 2Mn<sup>3+<\/sup> + 2e<sup>\u2212<\/sup>',\n      posNote: 'Pale Mn\u00b2\u207a gives up electrons to the circuit and turns into violet Mn\u00b3\u207a.',\n      neg: '2H<sup>+<\/sup> + 2e<sup>\u2212<\/sup> \u2192 H<sub>2<\/sub>',\n      negNote: 'Protons arrive through the membrane, meet the electrons and form hydrogen gas. The compressor pushes it into the buffer tank, up to 30 bar.',\n      all: '2H<sup>+<\/sup> + 2Mn<sup>2+<\/sup> \u2192 H<sub>2<\/sub> + 2Mn<sup>3+<\/sup>',\n      load: 'Charger', gas: 'H\u2082 to compressor'\n    }\n  };\n\n  function setText() {\n    var t = TXT[charging ? 'charge' : 'discharge'];\n    $('eq-pos').innerHTML = t.pos;\n    $('note-pos').textContent = t.posNote;\n    $('eq-neg').innerHTML = t.neg;\n    $('note-neg').textContent = t.negNote;\n    $('eq-all').innerHTML = t.all;\n    $('load-label').textContent = t.load;\n    $('gas-label').textContent = t.gas;\n    scene.classList.toggle('night', !charging);\n    $('comp-ring').style.stroke = charging ? 'var(--green)' : '';\n    $('comp-ring').style.strokeWidth = charging ? '4' : '';\n    $('reg-ring').style.stroke = charging ? '' : 'var(--green)';\n    $('reg-ring').style.strokeWidth = charging ? '' : '4';\n    $('btn-charge').setAttribute('aria-pressed', String(charging));\n    $('btn-discharge').setAttribute('aria-pressed', String(!charging));\n  }\n\n  function setStatus() {\n    var s;\n    if (charging) s = soc >= 97 ? 'Fully charged. Ready to deliver when it is needed.' : 'Daytime: surplus solar and wind power is stored in the electrolyte and as hydrogen.';\n    else s = soc <= 3 ? 'Fully discharged. Ready to charge from the next wind and sun.' : 'Evening: the stored energy is released to power the data centre.';\n    $('status').textContent = s;\n  }\n\n  /* ---------- drawing ---------- */\n  function draw() {\n    FLOWS.forEach(function (f) {\n      var r = f.get(), p, xy, i;\n      for (i = 0; i < f.parts.length; i++) {\n        p = f.parts[i];\n        if (!r) { p.e.setAttribute('opacity', 0); continue; }\n        xy = routeAt(r, p.u * r.len);\n        p.e.setAttribute('cx', xy[0].toFixed(1)); p.e.setAttribute('cy', xy[1].toFixed(1));\n        p.e.setAttribute('opacity', f.fade ? Math.min(1, Math.min(p.u, 1 - p.u) / (typeof f.fade === 'number' ? f.fade : 0.06)).toFixed(2) : 1);\n        if (f.fill) p.e.setAttribute('fill', f.fill(p.u));\n      }\n    });\n    $('pump').setAttribute('transform', 'rotate(' + ang + ' 405 455)');\n    $('comp').setAttribute('transform', 'rotate(' + cang + ' 867 405)');\n    $('blades').setAttribute('transform', 'rotate(' + bang + ' 193 248)');\n    var f = soc / 100, bar = 1 + 29 * f;\n    $('liquidBulk').setAttribute('fill', mix(MN2, MN3, f));\n    $('gas').setAttribute('opacity', (0.08 + 0.5 * f).toFixed(2));\n    $('pbar').textContent = bar.toFixed(1);\n    $('needle').setAttribute('transform', 'rotate(' + (-120 + (bar - 1) / 29 * 240).toFixed(1) + ' 1008 370)');\n    $('bar-fill').style.width = soc.toFixed(1) + '%';\n    $('soc-val').textContent = Math.round(soc) + '%';\n    $('bar').setAttribute('aria-valuenow', Math.round(soc));\n  }\n\n  var last = null, statusTick = 0;\n  function frame(now) {\n    if (last === null) last = now;\n    var dt = Math.min(0.05, (now - last) / 1000); last = now;\n    if (playing) {\n      FLOWS.forEach(function (f) {\n        var r = f.get();\n        if (!r) return;\n        f.parts.forEach(function (p) { p.u = (p.u + dt * f.speed / r.len) % 1; });\n      });\n      ang = (ang + dt * 200) % 360;\n      if (charging) { cang = (cang + dt * 300) % 360; }\n      bang = (bang + dt * (charging ? 70 : 8)) % 360;\n      soc = clamp(soc + (charging ? 1 : -1) * dt * 2.2, 3, 97);\n      if (charging && soc >= 97) setMode(false); else if (!charging && soc <= 3) setMode(true);\n      statusTick += dt;\n      if (statusTick > 0.4) { statusTick = 0; setStatus(); }\n      draw();\n    }\n    requestAnimationFrame(frame);\n  }\n\n  function setMode(c) { charging = c; setText(); setStatus(); draw(); }\n  $('btn-charge').addEventListener('click', function () { setMode(true); });\n  $('btn-discharge').addEventListener('click', function () { setMode(false); });\n  $('btn-play').addEventListener('click', function () {\n    playing = !playing;\n    $('btn-play').textContent = playing ? 'Pause' : 'Play or: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.4; }\n.app { display: flex; flex-direction: column; min-height: 100vh; }\n.hero { background: var(--hero-bg); color: var(--hero-fg); flex: none; }\n.hero-in { max-width: none; margin-inline: auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px 28px; flex-wrap: wrap; }\n.logo { display: block; width: 190px; height: 18.5px; flex: none; }\nh1 { font-size: 17px; line-height: 1.2; font-weight: 900; text-transform: uppercase; margin: 0; letter-spacing: 0.5px; }\n.eyebrow { font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--green); margin-left: auto; }\n.main { flex: 1; min-height: 0; max-width: none; width: 100%; box-sizing: border-box; margin-inline: auto; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; }\n.stage { position: relative; min-height: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); }\n.figbox { position: relative; flex: 1; min-height: 0; }\n.figbox svg { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--stroke); }\n.tools { position: absolute; top: 10px; left: 10px; display: flex; align-items: center; gap: 8px; z-index: 1; }\n.seg { display: inline-flex; border: 1px solid var(--line); background: var(--panel); }\n.seg button { font: 600 13px var(--font-body); padding: 7px 14px; border: 0; background: transparent; color: var(--fg); cursor: pointer; }\n.seg button[aria-pressed=\"true\"] { background: var(--green); color: var(--on-green); }\n.seg button:focus-visible, .chip:focus-visible, input[type=\"range\"]:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }\n.tools small { color: var(--muted); font-size: 12px; }\n.legend { position: absolute; right: 10px; top: 10px; z-index: 1; display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 8px 10px; list-style: none; font-size: 12.5px; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); }\n.legend li { display: flex; align-items: center; gap: 8px; }\n.dot { width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--stroke); flex: none; }\n.sw { width: 14px; height: 10px; flex: none; border: 1px solid var(--stroke); }\n.cap { margin: 0; padding: 7px 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }\n.side { display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow-y: auto; }\n.grp { font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin: 2px 0 -2px; }\n.ctl { background: var(--panel); border: 1px solid var(--line); padding: 8px 14px 4px; }\n.ctl-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }\n.ctl-name { font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }\n.ctl-val { font-family: var(--font-mono); font-weight: 700; font-size: 24px; font-variant-numeric: tabular-nums; }\ninput[type=\"range\"] { width: 100%; height: 26px; margin: 0; accent-color: var(--green); cursor: pointer; }\n.ticks { position: relative; height: 16px; font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); }\n.ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }\n.ticks span:first-child { transform: none; }\n.ticks span:last-child { transform: translateX(-100%); }\n.presets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }\n.chip { font: 600 12.5px var(--font-mono); padding: 7px 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }\n.chip[aria-pressed=\"true\"] { background: var(--green); color: var(--on-green); border-color: var(--green); }\n.out { display: grid; row-gap: 0; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--green); padding: 4px 14px; }\n.out.t { border-left-color: var(--purple); }\n.out.h { border-left-color: #8fa9a5; }\n.out.d { border-left-color: var(--fg); }\n.out h2 { grid-column: 1; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0; }\n.out .v { margin: 0; grid-column: 2; grid-row: 1 / span 2; text-align: right; font-size: 21px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }\n.out .s { grid-column: 1; font-size: 12.5px; color: var(--muted); margin: 0; }\n.dur-wrap { background: var(--panel); border: 1px solid var(--line); padding: 8px 14px 6px; }\n.dtrack { position: relative; height: 8px; margin-top: 10px; background: linear-gradient(90deg, var(--green), var(--purple)); }\n.dtrack i { position: absolute; top: -5px; width: 3px; height: 18px; background: var(--fg); transform: translateX(-50%); transition: left 0.3s; }\n.dticks { position: relative; height: 16px; margin-top: 6px; font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); }\n.dticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }\n.dticks span:first-child { transform: none; }\n.dticks span:last-child { transform: translateX(-100%); }\nsvg text { font-family: var(--font-body); fill: var(--fg); }\nsvg .lab { font-weight: 600; }\n@media (min-width: 980px) {\n  .app { height: 100vh; height: 100dvh; min-height: 560px; }\n  .stage { height: 100%; }\n}\n@media (max-width: 979px) {\n  .main { grid-template-columns: 1fr; }\n  .figbox { flex: none; height: 62vw; min-height: 340px; }\n  .eyebrow { display: none; }\n}\n<\/style>\n<style>\nhtml,body{margin:0;width:1920px;height:1016px;overflow:hidden}\n.app{height:1016px;min-height:0}\n.main{grid-template-columns:minmax(0,1fr) 540px;gap:20px;padding:20p  at full power<\/h2><p class=\"v\" id=\"st-d\">20 h<\/p><p class=\"s\" id=\"st-d2\">100 MWh \u00f7 5 MW<\/p><\/div>\n    <div class=\"dur-wrap\">\n      <span class=\"ctl-name\">Duration, log scale<\/span>\n      <div class=\"dtrack\"><i id=\"dmark\" style=\"left:50%\"><\/i><\/div>\n      <div class=\"dticks\" aria-hidden=\"true\"><span style=\"left:0\">6 min<\/span><span style=\"left:25%\">1 h<\/span><span style=\"left:50%\">10 h<\/span><span style=\"left:75%\">100 h<\/span><span style=\"left:100%\">1,000 h<\/span><\/div>\n    <\/div>\n  <\/aside>\n<\/div>\n<\/div>\n\n<script>\n(function () {\n  var $ = function (id) { return document.getElementById(id); };\n  var NS = 'http://www.w3.org/2000/svg';\n  var clamp = function (v, lo, hi) { return Math.max(lo, Math.min(hi, v)); };\n  var reduce = false;\n\n  /* isometric projection: x runs right-down, y runs left-down, z is up; equal scale on all three axes */\n  var K = 0.866, OX = 720, OY = 130;\n  function P(x, y, z) { return [OX + (x - y) * K, OY + (x + y) * 0.5 - z]; }\n  function pts(a) { return a.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' '); }\n  function poly(a, attrs) { return '<polygon points=\"' + pts(a) + '\" ' + attrs + '/>'; }\n\n  /* layout: electrolyte tanks (x=40), supply/return headers, containers, hydrogen header, hydrogen vessels (x=270) */\n  var NC = 10, NT = 10, PC = 72, PT = 82, YC = 360;\n  var CX0 = 150, CX1 = 176, CL = 64, CH = 26;\n  var TX = 40, TRMAX = 34;\n  var SUP_X = 96, RET_X = 108;\n  var GX = 222, HX = 270, HRMAX = 30;\n  var X_LO = -12, X_HI = 330, Y_LO = -50, Y_HI = 770;\n  function cy(i) { return YC + (i - (NC - 1) / 2) * PC; }\n  function ty(i) { return YC + (i - (NT - 1) / 2) * PT; }\n\n  /* sizing assumptions */\n  var ENERGY = [1, 2, 5, 10, 20, 50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000];\n  var H2_M3_PER_MWH = 14;    // 30 bar, about 1.1 V per cell, ideal gas\n  var H2_KG_PER_MWH = 34;\n  var power = 5, energy = 100, gasDir = 1;\n  var nC = 5, nT = 1, eT = 100;\n  var cs = [], ts = [], i;\n  for (i = 0; i < NC; i++) cs.push({ a: i < 5 ? 1 : 0 });\n  for (i = 0; i < NT; i++) ts.push({ a: i < 1 ? 1 : 0, R: 34 });\n  function tankR(e) { return Math.max(7, TRMAX * Math.cbrt(e / 100)); }\n\n  function bayEllipse(x, y, r) {\n    var c = P(x, y, 0);\n    return '<ellipse cx=\"' + c[0].toFixed(1) + '\" cy=\"' + c[1].toFixed(1) + '\" rx=\"' + (1.2247 * r).toFixed(1) + '\" ry=\"' + (0.7071 * r).toFixed(1) + '\" fill=\"none\" stroke=\"var(--bay)\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"/>';\n  }\n  function label(x, text, colour) {\n    var a = P(x, Y_HI + 4, 0);\n    return '<rect x=\"' + (a[0] - 6).toFixed(0) + '\" y=\"' + (a[1] + 34).toFixed(0) + '\" width=\"14\" height=\"10\" fill=\"' + colour + '\" stroke=\"currentColor\"/>' +\n      '<text class=\"lab\" x=\"' + (a[0] + 14).toFixed(0) + '\" y=\"' + (a[1] + 44).toFixed(0) + '\" font-size=\"17\">' + text + '<\/text>';\n  }\n  function buildGround() {\n    var s = '', k, yc;\n    s += poly([P(X_HI, Y_LO, 0), P(X_HI, Y_HI, 0), P(X_HI, Y_HI, -9), P(X_HI, Y_LO, -9)], 'fill=\"var(--ground-side)\" stroke=\"var(--line)\"');\n    s += poly([P(X_LO, Y_HI, 0), P(X_HI, Y_HI, 0), P(X_HI, Y_HI, -9), P(X_LO, Y_HI, -9)], 'fill=\"var(--ground-side)\" stroke=\"var(--line)\"');\n    s += poly([P(X_LO, Y_LO, 0), P(X_HI, Y_LO, 0), P(X_HI, Y_HI, 0), P(X_LO, Y_HI, 0)], 'fill=\"var(--ground)\" stroke=\"var(--line)\"');\n    for (k = 0; k < NC; k++) {\n      yc = cy(k);\n      s += poly([P(CX0 - 5, yc - CL / 2 - 4, 0), P(CX1 + 5, yc - CL / 2 - 4, 0), P(CX1 + 5, yc + CL / 2 + 4, 0), P(CX0 - 5, yc + CL / 2 + 4, 0)], 'fill=\"none\" stroke=\"var(--bay)\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"');\n    }\n    for (k = 0; k < NT; k++) { s += bayEllipse(TX, ty(k), TRMAX + 4); s += bayEllipse(HX, ty(k), HRMAX + 4); }\n    $('iso-ground').innerHTML = s;\n    $('iso-labels').innerHTML = label(TX, 'Electrolyte tanks', '#5e2e8b') + label(CX0 + 13, 'Containers', '#3cbeb3') + label(HX, 'Hydrogen vessels', '#bcd2ce');\n  }\n\n  var stubs = [];\n  function pipeSeg(p0, p1, a, wall, bore) {\n    var A = P(p0[0], p0[1], p0[2]), B = P(p1[0], p1[1], p1[2]);\n    var d = 'M' + A[0].toFixed(1) + ',' + A[1].toFixed(1) + ' L' + B[0].toFixed(1) + ',' + B[1].toFixed(1);\n    return '<g opacity=\"' + a.toFixed(2) + '\"><path d=\"' + d + '\" stroke=\"var(--pipe2)\" stroke-width=\"' + wall + '\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"' + d + '\" stroke=\"var(--bore)\" stroke-width=\"' + bore + '\" stroke-linecap=\"round\" fill=\"none\"/><\/g>';\n  }\n  function tankSVG(i, t) {\n    var R = t.R, H = Math.max(14, 2.1 * R), c = P(TX, ty(i), 0), top = P(TX, ty(i), H);\n    var rx = 1.2247 * R, ry = 0.7071 * R, s = '';\n    s += '<ellipse cx=\"' + (c[0] + rx * 0.3).toFixed(1) + '\" cy=\"' + (c[1] + ry * 0.25).toFixed(1) + '\" rx=\"' + (rx * 1.05).toFixed(1) + '\" ry=\"' + (ry * 1.05).toFixed(1) + '\" fill=\"#000\" opacity=\"0.14\"/>';\n    s += '<path d=\"M' + (c[0] - rx).toFixed(1) + ',' + top[1].toFixed(1) + ' L' + (c[0] - rx).toFixed(1) + ',' + c[1].toFixed(1) + ' A' + rx.toFixed(1) + ',' + ry.toFixed(1) + ' 0 0 0 ' + (c[0] + rx).toFixed(1) + ',' + c[1].toFixed(1) + ' L' + (c[0] + rx).toFixed(1) + ',' + top[1].toFixed(1) + ' Z\" fill=\"url(#tankGrad)\" stroke=\"#2a1040\" stroke-width=\"1\"/>';\n    [0.34, 0.67].forEach(function (f) {\n      var y = c[1] - (c[1] - top[1]) * f;\n      s += '<path d=\"M' + (c[0] - rx).toFixed(1) + ',' + y.toFixed(1) + ' A' + rx.toFixed(1) + ',' + ry.toFixed(1) + ' 0 0 0 ' + (c[0] + rx).toFixed(1) + ',' + y.toFixed(1) + '\" fill=\"none\" stroke=\"#000\" stroke-opacity=\"0.22\"/>';\n    });\n    s += '<ellipse cx=\"' + top[0].toFixed(1) + '\" cy=\"' + top[1].toFixed(1) + '\" rx=\"' + rx.toFixed(1) + '\" ry=\"' + ry.toFixed(1) + '\" fill=\"#9467bd\" stroke=\"#2a1040\"/>';\n    s += '<ellipse cx=\"' + (top[0] - rx * 0.25).toFixed(1) + '\" cy=\"' + (top[1] + ry * 0.05).toFixed(1) + '\" rx=\"' + (rx * 0.22).toFixed(1) + '\" ry=\"' + (ry * 0.22).toFixed(1) + '\" fill=\"#6f3f99\" stroke=\"#2a1040\" stroke-width=\"0.8\"/>';\n    return '<g opacity=\"' + t.a.toFixed(2) + '\">' + s + '<\/g>';\n  }\n  function sphereSVG(i, t) {\n    var Hr = Math.max(6, HRMAX * t.R / TRMAX), c = P(HX, ty(i), Hr), g = P(HX, ty(i), 0), rs = 1.2247 * Hr, s = '';\n    s += '<ellipse cx=\"' + (g[0] + rs * 0.3).toFixed(1) + '\" cy=\"' + (g[1] + rs * 0.1).toFixed(1) + '\" rx=\"' + (rs * 1.0).toFixed(1) + '\" ry=\"' + (rs * 0.58).toFixed(1) + '\" fill=\"#000\" opacity=\"0.14\"/>';\n    s += '<ellipse cx=\"' + g[0].toFixed(1) + '\" cy=\"' + g[1].toFixed(1) + '\" rx=\"' + (rs * 0.5).toFixed(1) + '\" ry=\"' + (rs * 0.29).toFixed(1) + '\" fill=\"#4b5a58\" stroke=\"#2c3836\"/>';\n    s += '<circle cx=\"' + c[0].toFixed(1) + '\" cy=\"' + c[1].toFixed(1) + '\" r=\"' + rs.toFixed(1) + '\" fill=\"url(#sphGrad)\" stroke=\"#3d5552\" stroke-width=\"1\"/>';\n    s += '<path d=\"M' + (c[0] - rs).toFixed(1) + ',' + c[1].toFixed(1) + ' A' + rs.toFixed(1) + ',' + (rs * 0.38).toFixed(1) + ' 0 0 0 ' + (c[0] + rs).toFixed(1) + ',' + c[1].toFixed(1) + '\" fill=\"none\" stroke=\"#2c3836\" stroke-opacity=\"0.35\"/>';\n    return '<g opacity=\"' + t.a.toFixed(2) + '\">' + s + '<\/g>';\n  }\n  function containerSVG(i, c) {\n    var yc = cy(i), y0 = yc - CL / 2, y1 = yc + CL / 2, lift = (1 - c.a) * 24, z0 = lift, z1 = CH + lift, s = '', yy, a, b;\n    var sh = P((CX0 + CX1) / 2 + 4, yc, 0);\n    s += '<ellipse cx=\"' + sh[0].toFixed(1) + '\" cy=\"' + sh[1].toFixed(1) + '\" rx=\"' + (CL * 0.62).toFixed(1) + '\" ry=\"' + (CL * 0.3).toFixed(1) + '\" fill=\"#000\" opacity=\"' + (0.12 * c.a).toFixed(2) + '\" transform=\"rotate(30 ' + sh[0].toFixed(1) + ' ' + sh[1].toFixed(1) + ')\"/>';\n    s += poly([P(CX1, y0, z0), P(CX1, y1, z0), P(CX1, y1, z1), P(CX1, y0, z1)], 'fill=\"#2b9d92\" stroke=\"#0f4f49\" stroke-linejoin=\"round\"');\n    s += poly([P(CX0, y1, z0), P(CX1, y1, z0), P(CX1, y1, z1), P(CX0, y1, z1)], 'fill=\"#46c6bb\" stroke=\"#0f4f49\" stroke-linejoin=\"round\"');\n    s += poly([P(CX0, y0, z1), P(CX1, y0, z1), P(CX1, y1, z1), P(CX0, y1, z1)], 'fill=\"#8adcd4\" stroke=\"#0f4f49\" stroke-linejoin=\"round\"');\n    for (yy = y0 + 4; yy < y1 - 2; yy += 4) {\n      a = P(CX1, yy, z0 + 2); b = P(CX1, yy, z1 - 2);\n      s += '<line x1=\"' + a[0].toFixed(1) + '\" y1=\"' + a[1].toFixed(1) + '\" x2=\"' + b[0].toFixed(1) + '\" y2=\"' + b[1].toFixed(1) + '\" stroke=\"#0f4f49\" stroke-opacity=\"0.28\"/>';\n    }\n    a = P((CX0 + CX1) / 2, y1, z0 + 2); b = P((CX0 + CX1) / 2, y1, z1 - 2);\n    s += '<line x1=\"' + a[0].toFixed(1) + '\" y1=\"' + a[1].toFixed(1) + '\" x2=\"' + b[0].toFixed(1) + '\" y2=\"' + b[1].toFixed(1) + '\" stroke=\"#0f4f49\" stroke-width=\"1.2\"/>';\n    var o = P(CX1, y1 - 10, z1 - 6);\n    s += '<g transform=\"matrix(' + K + ' -0.5 0 1 ' + o[0].toFixed(1) + ' ' + o[1].toFixed(1) + ')\"><use href=\"#ce-logo\" width=\"42\" height=\"4.1\" style=\"--la:#141414;--lb:#141414\"/><\/g>';\n    return '<g opacity=\"' + Math.min(1, c.a * 1.6).toFixed(2) + '\">' + s + '<\/g>';\n  }\n\n  function render() {\n    var list = [], k, a, yS, yE, yMin = 1e9, yMax = -1e9, R, y;\n    stubs = [];\n    for (k = 0; k < NT; k++) if (ts[k].a > 0.02) { yMin = Math.min(yMin, ty(k)); yMax = Math.max(yMax, ty(k)); }\n    for (k = 0; k < NC; k++) if (cs[k].a > 0.02) { yMin = Math.min(yMin, cy(k)); yMax = Math.max(yMax, cy(k)); }\n    if (yMin < 1e8) {\n      yS = yMin - 12; yE = yMax + 12;\n      list.push({ k: -100, s: pipeSeg([SUP_X, yS, 3], [SUP_X, yE, 3], 1, 7, 4) + pipeSeg([RET_X, yS, 3], [RET_X, yE, 3], 1, 7, 4) });\n      for (y = yS; y < yE; y += 24) {   // hydrogen header in short segments so vessels can sit in front of it\n        var y2 = Math.min(yE, y + 24);\n        list.push({ k: GX + (y + y2) / 2 - 3, s: pipeSeg([GX, y, 5], [GX, y2, 5], 1, 6, 3.4) });\n      }\n    }\n    for (k = 0; k < NT; k++) {\n      var t = ts[k]; if (t.a <= 0.02) continue;\n      R = t.R; a = t.a;\n      var Hr = Math.max(6, HRMAX * R / TRMAX);\n      list.push({ k: TX + ty(k), s: tankSVG(k, t) });\n      list.push({ k: TX + ty(k) + 50, s: pipeSeg([TX + R, ty(k) - 6, 3], [SUP_X, ty(k) - 6, 3], a, 5, 2.8) + pipeSeg([RET_X, ty(k) + 6, 8], [TX + R, ty(k) + 6, 8], a, 5, 2.8) });\n      stubs.push({ p0: [TX + R, ty(k) - 6, 3], p1: [SUP_X, ty(k) - 6, 3], col: '#5e2e8b', a: a });\n      stubs.push({ p0: [RET_X, ty(k) + 6, 8], p1: [TX + R, ty(k) + 6, 8], col: '#eab0c2', a: a });\n      list.push({ k: HX + ty(k) - 6, s: pipeSeg([GX, ty(k), 5], [HX - Hr * 0.8, ty(k), 5], a, 5, 2.8) });\n      list.push({ k: HX + ty(k), s: sphereSVG(k, t) });\n      stubs.push({ p0: [GX, ty(k), 5], p1: [HX - Hr * 0.8, ty(k), 5], col: '#3cbeb3', a: a, gas: true });\n    }\n    for (k = 0; k < NC; k++) {\n      var c = cs[k]; if (c.a <= 0.02) continue;\n      a = Math.min(1, c.a * 1.6);\n      list.push({ k: CX1 + cy(k), s: containerSVG(k, c) });\n      list.push({ k: CX0 + cy(k) - 50, s: pipeSeg([SUP_X, cy(k) - 10, 8], [CX0, cy(k) - 10, 8], a, 5, 2.8) + pipeSeg([CX0, cy(k) + 10, 3], [RET_X, cy(k) + 10, 3], a, 5, 2.8) });\n      stubs.push({ p0: [SUP_X, cy(k) - 10, 8], p1: [CX0, cy(k) - 10, 8], col: '#5e2e8b', a: a });\n      stubs.push({ p0: [CX0, cy(k) + 10, 3], p1: [RET_X, cy(k) + 10, 3], col: '#eab0c2', a: a });\n      list.push({ k: CX1 + cy(k) + 1, s: pipeSeg([CX1, cy(k), 5], [GX, cy(k), 5], a, 5, 2.8) });\n      stubs.push({ p0: [CX1, cy(k), 5], p1: [GX, cy(k), 5], col: '#3cbeb3', a: a, gas: true });\n    }\n    list.sort(function (p, q) { return p.k - q.k; });\n    $('iso-items').innerHTML = list.map(function (o) { return o.s; }).join('');\n    var g = $('iso-dots'), need = stubs.length * 2;\n    while (g.childNodes.length < need) {\n      var d = document.createElementNS(NS, 'circle');\n      d.setAttribute('r', 2.7); d.setAttribute('stroke', '#141414'); d.setAttribute('stroke-width', 0.6);\n      g.appendChild(d);\n    }\n    for (k = need; k < g.childNodes.length; k++) g.childNodes[k].setAttribute('opacity', 0);\n  }\n\n  var time = 0;\n  function moveDots() {\n    var g = $('iso-dots'), j, n, u, st, p, d;\n    for (j = 0; j < stubs.length; j++) {\n      st = stubs[j];\n      for (n = 0; n < 2; n++) {\n        u = (time * (st.gas ? 0.22 : 0.32) + j * 0.37 + n * 0.5) % 1;\n        if (st.gas && gasDir < 0) u = 1 - u;\n        p = P(st.p0[0] + (st.p1[0] - st.p0[0]) * u, st.p0[1] + (st.p1[1] - st.p0[1]) * u, st.p0[2] + (st.p1[2] - st.p0[2]) * u);\n        d = g.childNodes[j * 2 + n];\n        d.setAttribute('cx', p[0].toFixed(1)); d.setAttribute('cy', p[1].toFixed(1));\n        d.setAttribute('fill', st.col); d.setAttribute('opacity', Math.min(1, st.a * Math.min(1, Math.min(u, 1 - u) / 0.12)).toFixed(2));\n      }\n    }\n  }\n\n  function fmtE(e) { return e >= 1000 ? (e / 1000) + ' GWh' : e + ' MWh'; }\n  function fmtN(n) { return Math.round(n).toLocaleString('en-GB'); }\n  function fmtDur(h) {\n    if (h < 1) return Math.round(h * 60) + ' min';\n    var txt = (h < 10 ? (Math.round(h * 10) / 10) : Math.round(h)).toLocaleString('en-GB') + ' h';\n    if (h >= 48) txt += ' (' + Math.round(h / 24) + ' d)';\n    return txt;\n  }\n  function fmtMass(kg) { return kg < 1000 ? fmtN(kg) + ' kg' : (Math.round(kg / 100) / 10).toLocaleString('en-GB') + ' t'; }\n  function readouts() {\n    var h = energy / power;\n    $('pw-out').textContent = power + ' MW';\n    $('en-out').textContent = fmtE(energy);\n    $('st-d').textContent = fmtDur(h);\n    $('st-d2').textContent = fmtE(energy) + ' \u00f7 ' + power + ' MW';\n    $('dmark').style.left = clamp((Math.log10(h) + 1) / 4 * 100, 0, 100) + '%';\n    document.querySelectorAll('.chip').forEach(function (b) {\n      b.setAttribute('aria-pressed', String(+b.dataset.p === power && +b.dataset.e === energy));\n    });\n  }\n\n  var dirty = true, last = null;\n  function apply() {\n    nC = power; nT = Math.ceil(energy / 100); eT = energy / nT;\n    var tr = tankR(eT), k;\n    for (k = 0; k < NC; k++) cs[k].ta = k < nC ? 1 : 0;\n    for (k = 0; k < NT; k++) { ts[k].ta = k < nT ? 1 : 0; ts[k].tR = k < nT ? tr : ts[k].R; }\n    if (reduce) { for (k = 0; k < NC; k++) cs[k].a = cs[k].ta; for (k = 0; k < NT; k++) { ts[k].a = ts[k].ta; ts[k].R = ts[k].tR; } dirty = true; }\n    readouts();\n  }\n  function frame(now) {\n    if (last === null) last = now;\n    var dt = Math.min(0.05, (now - last) / 1000); last = now;\n    var f = Math.min(1, dt * 9), k, ch = false, v;\n    for (k = 0; k < NC; k++) { v = cs[k].ta; if (Math.abs(v - cs[k].a) > 0.002) { cs[k].a += (v - cs[k].a) * f; ch = true; } else if (cs[k].a !== v) { cs[k].a = v; ch = true; } }\n    for (k = 0; k < NT; k++) {\n      v = ts[k].ta;\n      if (Math.abs(v - ts[k].a) > 0.002) { ts[k].a += (v - ts[k].a) * f; ch = true; } else if (ts[k].a !== v) { ts[k].a = v; ch = true; }\n      if (Math.abs(ts[k].tR - ts[k].R) > 0.02) { ts[k].R += (ts[k].tR - ts[k].R) * f; ch = true; } else if (ts[k].R !== ts[k].tR) { ts[k].R = ts[k].tR; ch = true; }\n    }\n    if (ch || dirty) { render(); dirty = false; }\n    if (!reduce) time += dt;\n    moveDots();\n    requestAnimationFrame(frame);\n  }\n\n  var pw = $('pw'), en = $('en');\n  pw.addEventListener('input', function () { power = +pw.value; apply(); });\n  en.addEventListener('input', function () { energy = ENERGY[+en.value]; apply(); });\n  document.querySelectorAll('.chip').forEach(function (b) {\n    b.addEventListener('click', function () {\n      power = +b.dataset.p; energy = +b.dataset.e;\n      pw.value = power; en.value = ENERGY.indexOf(energy);\n      apply();\n    });\n  });\n\n\n  buildGround();\n  apply();\n  for (i = 0; i < NC; i++) cs[i].a = cs[i].ta;\n  for (i = 0; i < NT; i++) { ts[i].a = ts[i].ta; ts[i].R = ts[i].tR; }\n  render(); moveDots();\n  requestAnimationFrame(frame);\n})();\n<\/script>\n<script>document.addEventListener('keydown',function(e){try{parent.postMessage({key:e.key},'*')}catch(_){}});<\/script><\/body><\/html>",c:"<!doctype html><html lang=\"en\" data-theme=\"light\"><h ody>\n<style>\n/* A stylised map of the Humber (north at the top, not to scale) with three Certain Energy storage sites:\n   1 behind the meter with renewables (Easington), 2 on the grid, 3 behind the meter with a data centre.\n   Fixed 1920 x 1080 stage that scales to fit the window. Palette and type from certainenergy.com. */\n:root {\n  --bg: #f9f9f9; --panel: #ffffff; --fg: #141414; --muted: #5b5f61; --line: #e1e1e1;\n  --green: #3cbeb3; --purple: #5e2e8b; --power: #ffc928; --h2: #3cbeb3;\n  --land: #f0f0ea; --sea: #cfe5ea; --coast: #8fa3a6;\n  --font-body: \"Overpass\", Helvetica, Calibri, Arial, sans-serif;\n  --font-mono: \"Overpass Mono\", ui-monospace, Menlo, Consolas, monospace;\n}\nhtml, body { margin: 0; height: 100%; background: #000; overflow: hidden; }\n#stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: center center;\n  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 18px; line-height: 1.4; display: flex; flex-direction: column; }\n#bar { flex: none; height: 64px; background: #000; color: #fff; display: flex; align-items: center; gap: 36px; padding: 0 40px; }\n#bar svg.logo { width: 236px; height: 23px; flex: none; }\n#bar h1 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase; }\n#bar .tag { margin-left: auto; font: 600 14px var(--font-mono); letter-spacing: 2px; text-transform: uppercase; color: var(--green); }\n#main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 20px; padding: 18px 24px 18px 24px; }\n#mapbox { position: relative; background: var(--sea); border: 1px solid var(--line); overflow: hidden; }\n#map { position: absolute; inset: 0; width: 100%; height: 100%; }\n#tools { position: absolute; top: 14px; left: 14px; display: flex; align-items: center; gap: 14px; z-index: 2; }\n.seg { display: inline-flex; border: 1px solid var(--line); background: var(--panel); }\n.seg button { font: 600 15px var(--font-mono); letter-spacing: 2px; text-transform: uppercase; padding: 13px 22px; border: 0; background: transparent; color: var(--fg); cursor: pointer; }\n.seg button + button { border-left: 1px solid var(--line); }\n.seg button[aria-pressed=\"true\"] { background: var(--green); color: #141414; }\n.play { font: 600 15px var(--font-mono); letter-spacing: 2px; text-transform: uppercase; padding: 13px 20px; border: 1px solid var(--line); background: #1a1b1f; color: #fff; cursor: pointer; min-width: 110px; }\n#status { position: absolute; left: 14px; top: 70px; z-index: 2; max-width: 760px; font-size: 21px; color: var(--fg); background: color-mix(in srgb, var(--panel) 90%, transparent); padding: 8px 14px; border: 1px solid var(--line); }\n#side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }\n#side h2.t { margin: 0; font: 600 13px var(--font-mono); letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }\n.site { background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--purple); padding: 10px 16px 12px; cursor: pointer; transition: box-shadow .3s, border-color .3s; }\n.site.on { box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 55%, transparent); border-left-color: var(--green); }\n.site .hd { display: flex; align-items: center; gap: 12px; }\n.site .n { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--purple); color: #fff; font: 700 17px var(--font-mono); display: grid; place-items: center; }\n.site h3 { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.15; }\n.site p { margin: 6px 0 0; font-size: 16.5px; color: var(--muted); line-height: 1.35; }\n.site p.live { color: var(--fg); font-weight: 600; margin-top: 6px; }\n#together { background: #000; color: #fff; padding: 12px 18px; font-size: 17px; line-height: 1.4; }\n#together b { color: var(--green); font-family: var(--font-mono); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; display: block; margin-bottom: 4px; }\n#key { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 15px; margin: 0; padding: 0; list-style: none; }\n#key li { display: flex; align-items: center; gap: 8px; }\n.dot { width: 13px; height: 13px; border-radius: 50%; border: 1px solid #141414; flex: none; }\n.pip { width: 26px; height: 9px; flex: none; background: rgba(60,190,179,.45); border: 1px solid #2b9d92; }\n.bx { width: 18px; height: 12px; flex: none; background: #3cbeb3; border: 1px solid #0f4f49; }\n.tk { width: 14px; height: 18px; flex: none; background: #5e2e8b; border: 2px solid #141414; box-sizing: border-box; }\n.sp { width: 26px; height: 14px; flex: none; border-radius: 7px; background: #a9e4de; border: 2px solid #141414; box-sizing: border-box; }\n.dash { width: 22px; height: 12px; flex: none; border: 2px dashed #5e2e8b; box-sizing: border-box; }\n#note { font-size: 13.5px; color: var(--muted); margin: 0; line-height: 1.35; }\nsvg text { font-family: var(--font-body); fill: #1d2226; }\n.halo { paint-order: stroke; stroke: #f4f5f1; stroke-width: 4px; stroke-linejoin: round; }\n.halo-s { paint-order: stroke; stroke: #cfe5ea; stroke-width: 4px; stroke-linejoin: round; }\n.lab { font-weight: 700; font-size: 19px; }\n.sub { font-size: 16px; fill: #4b5457; }\n.ring { fill: none; stroke: #3cbeb3; stroke-width: 5; opacity: 0; transition: opacity .4s; }\n.ring.on { opacity: 1; animation: pulse 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }\n@keyframes pulse { 0% { transform: scale(.9); opacity: 1; } 100% { transform: scale(1.18); opacity: 0; } }\n<\/style>\n<style>\nhtml,body{background:#f9f9f9!important}\n#stage{position:absolute!important;left:0!important;top:0!important;transform:none!important;width:1920px!important;height:1016px!important}\n<\/style>\n\n<!-- Certain Energy wordmark, reused in the hero and on the container. Colours come from --la (CERTAIN) and --lb (ENERGY). -->\n<svg width=\"0\" height=\" lb\" d=\"M428.04,42.72v-16.59l-13.86-25.41h3.51l11.94,22.23,11.97-22.23h3.48l-13.86,25.38v16.62h-3.18Z\"/>\n  <\/symbol>\n<\/svg>\n\n\n\n<div id=\"stage\">\n  \n  <div id=\"main\">\n    <div id=\"mapbox\">\n      <div id=\"tools\">\n        <div class=\"seg\" role=\"group\" aria-label=\"Weather\">\n          <button type=\"button\" id=\"b-wind\" aria-pressed=\"true\">Windy<\/button>\n          <button type=\"button\" id=\"b-calm\" aria-pressed=\"false\">Calm<\/button>\n        <\/div>\n        <button type=\"button\" class=\"play\" id=\"b-play\">Pause<\/button>\n      <\/div>\n      <div id=\"status\" aria-live=\"polite\"><\/div>\n      <svg id=\"map\" viewBox=\"360 50 1200 833\" role=\"img\" aria-label=\"Stylised map of the Humber region showing offshore wind, the Easington hydrogen hub, Rough offshore storage, Aldbrough salt caverns, Saltend, ports, bulk liquid storage, a data centre and industry, with hydrogen pipelines and power cables. Three flow battery sites are marked: behind the meter with renewables at Easington, on the grid, and behind the meter with a data centre.\">\n        <g id=\"g-base\"><\/g>\n        <g id=\"g-lines\"><\/g>\n        <g id=\"g-icons\"><\/g>\n        <g id=\"g-dots\"><\/g>\n        <g id=\"g-labels\"><\/g>\n      <\/svg>\n    <\/div>\n    <aside id=\"side\">\n      <h2 class=\"t\">Three ways to use it<\/h2>\n      <section class=\"site on\" data-i=\"0\"><div class=\"hd\"><span class=\"n\">1<\/span><h3>Behind the meter with renewables<\/h3><\/div>\n        <p>Offshore wind feeds the Easington electrolysers through the battery. No hydrogen tank of its own: it uses the pipeline.<\/p><p class=\"live\" id=\"live0\"><\/p><\/section>\n      <section class=\"site\" data-i=\"1\"><div class=\"hd\"><span class=\"n\">2<\/span><h3>On the grid<\/h3><\/div>\n        <p>Takes in offshore wind the grid cannot use and returns it for many hours. Has its own hydrogen store.<\/p><p class=\"live\" id=\"live1\"><\/p><\/section>\n      <section class=\"site\" data-i=\"2\"><div class=\"hd\"><span class=\"n\">3<\/span><h3>Behind the meter with a data centre<\/h3><\/div>\n        <p>Firms the supply to a large industrial load at Immingham. Uses the existing bulk liquid storage as its electrolyte store.<\/p><p class=\"live\" id=\"live2\"><\/p><\/section>\n      <div id=\"together\"><b>Working together<\/b>Hydrogen stores energy for weeks and seasons. Flow batteries cover the hours and days in between, and keep electrolysers and big loads running steadily.<\/div>\n      <ul id=\"key\">\n        <li><span class=\"dot\" style=\"background:#ffc928\"><\/span>Electric power<\/li>\n        <li><span class=\"dot\" style=\"background:#3cbeb3\"><\/span>Hydrogen<\/li>\n        <li><span class=\"pip\"><\/span>Hydrogen pipeline<\/li>\n        <li><span class=\"bx\"><\/span>Power module<\/li>\n        <li><span class=\"tk\"><\/span>Electrolyte store<\/li>\n        <li><span class=\"sp\"><\/span>Hydrogen store<\/li>\n        <li style=\"grid-column:1/-1\"><span class=\"dash\"><\/span>Behind the meter (shares the customer's connection)<\/li>\n      <\/ul>\n      <p id=\"note\">Illustrative only: positions are indicative and the map is not to scale. The Easington, Aldbrough and Saltend hydrogen projects and the Humber pipeline are proposals by Centrica, Equinor, SSE and National Gas. Wind farm and data centre locations are examples.<\/p>\n    <\/aside>\n  <\/div>\n<\/div>\n\n<script>\n(function () {\n  var $ = function (id) { return document.getElementById(id); };\n  var NS = 'http://www.w3.org/2000/svg';\n  var clamp = function (v, lo, hi) { return Math.max(lo, Math.min(hi, v)); };\n  var reduce = false;\n\n  /* ---------- scale the 1920 x 1080 stage to the window ---------- */\n  var stage = $('stage');\n  function fit() { var s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')'; }\n  addEventListener('resize', fit); fit();\n\n  /* ---------- routes ---------- */\n  functi
